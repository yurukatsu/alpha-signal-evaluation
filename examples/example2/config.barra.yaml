# 社内環境用: リターンとリスクモデルを社内 DB の Barra（GEMLT）から読む設定（example2 と同じ入力形式）。
# input/ には実データの alpha / bm / univ / calendar.dat（BID のシグナル等）を置く。
# make_sample_data.py の合成データは BID が実在しないため、Barra のリターンと一致しない。
# 銘柄 ID は asset_id: bid（GEMLT の既定）: 日本株も含めて BID のまま（barraid_jp は使わない）。
# .env に接続先 risk_models の設定が必要。
#
#   uv run alpha-eval validate examples/example2/config.barra.yaml
#   uv run alpha-eval run examples/example2/config.barra.yaml
#   uv run python scripts/check_barra.py compare examples/example2/config.barra.yaml
#
# 相対パスはこのファイルの場所を基準に解決される。
version: 1

calendar:
  path: ./input/calendar.dat   # 本番のカレンダー。先頭のコメント行は読み飛ばす
  index: Base_month            # 内部で全データに付与する日付キー（YYYYMM）
  # columns: [Base_month, ...] # ヘッダー行がないファイルの場合は列名を指定する

period:
  start: "200801"              # データは 2008-01 から
  end: "202607"                # 末尾はホライズン分のリターンがないため欠損になる（警告が出る）

horizons: [1, 3, 6, 12]        # 単位 = カレンダーの行数（月）

data:
  signals:
    # alpha/{Base_month}.dat は Base_month の月末時点のスコア（翌月以降のリターンで評価する）
    source: file
    path: ./input/alpha/{Base_month}.dat        # ヘッダー "#bid comp_ew"（先頭の # は自動で除去）
    read_options: {sep: '\s+'}             # スペース区切り
    columns: {asset_id: bid}
    values: [comp_ew]

universe:
  source: file
  path: ./input/univ/{Base_month}.dat           # "# ..." のコメント行 + ID・ウェイトのスペース区切り
  read_options: {sep: '\s+', comment: "#", header: null, names: [bid, weight]}
  columns: {asset_id: bid}

benchmark:
  source: file
  path: ./input/bm/{Base_month}.dat
  read_options: {sep: '\s+', comment: "#", header: null, names: [bid, weight]}
  columns: {asset_id: bid, weight: weight}

returns:
  # Barra の日次リターン（DRTN / SRTN）を、カレンダーの月（Trading_month の1日〜月末日）ごとに集約する
  - source: barra
    model: GEMLT
    match_on: Trading_month
    convention: realized
    currency: USD                # トータルリターンを日次で USD 建てにする（local なら取引通貨建て）
    asset_id: bid                # 日本株も含めて BID のまま（barraid_jp は使わない）
    series: {total: total, specific: specific}

risk_models:
  # Barra のリスクモデル。エクスポージャー・共分散は Trading_month の月末以前で最新の Barra の
  # 営業日のデータ、ファクターリターンはリターンと同じ月ごとに加算で集約する
  gemlt:
    source: barra
    model: GEMLT
    match_on: Trading_month
    components: [exposures, factor_covariance, factor_returns]
    asset_id: bid
    specific_return: specific

metrics:
  - name: ic
    params: {method: spearman}
  - name: quantile
    params: {n_quantiles: 5}
  - name: alpha_decay
  - name: autocorr
    params: {lags: [1, 3, 6, 12]}
  # シグナル間と、シグナル × Barra のスタイル（risk_indices）エクスポージャーの相関
  - name: factor_correlation
    params: {risk_model: gemlt, factor_group: style}

execution:
  n_jobs: 4

output:
  dir: ./output/barra           # サンプルの結果（./output）と分ける
  formats: [csv]
