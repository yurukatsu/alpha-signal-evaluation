# 社内環境用: リターンとリスクモデルを社内 DB の Barra（JPE4）から読む設定（example1 と同じ入力形式）。
# input/ には社内の input.zip のデータ（nri_code のシグナル等）を置く。make_sample_data.py の
# 合成データは銘柄コードが実在しないため、Barra のリターンと一致しない。
# .env に接続先 risk_models と fs_trfac_glb の設定が必要。
#
#   uv run alpha-eval validate examples/example1/config.barra.yaml
#   uv run alpha-eval run examples/example1/config.barra.yaml
#   uv run python scripts/check_barra.py compare examples/example1/config.barra.yaml
#
# 相対パスはこのファイルの場所を基準に解決される。
version: 1

calendar:
  path: ./input/calendar.dat   # タブ・スペース・全角スペースが混在していても読める
  index: Base_day              # 内部で全データに付与する日付キー

period:
  start: "20190329"            # calendar.index（Base_day）の値で絞る
  end: "20260731"              # 末尾はホライズン分のリターンがないため欠損になる（警告が出る）

horizons: [1, 3, 6]            # 単位 = カレンダーの行数（月）

data:
  signals:
    # シグナルのファイルは Trading_day の前営業日（Label2）で作られている。
    # どの列でファイルを選んでも、データには Base_day が付与される
    - source: file
      path: ./input/alpha/ai/{Label2}.csv   # ヘッダー "#nri_code,score"（先頭の # は自動で除去）
      columns: {asset_id: nri_code}
      values: {ai: score}                   # {シグナル名: 列名}
    - source: file
      path: ./input/alpha/dss/{Label2}.csv  # ヘッダーなし
      read_options: {header: null, names: [nri_code, score]}
      columns: {asset_id: nri_code}
      values: {dss: score}
  classification:
    source: file
    path: ./input/labels/{Label2}.csv      # L001〜L010 の one-hot
    columns: {asset_id: nri_code}
    one_hot: true                           # 1 が立っている列名（L001 等）をカテゴリにする

universe:
  source: file
  path: ./input/univ/{Trading_day}.dat     # "# ..." のコメント行 + コード・ウェイトのタブ区切り
  read_options: {sep: "\t", comment: "#", header: null, names: [nri_code, weight]}
  columns: {asset_id: nri_code, weight: weight}   # weight はベンチマークウェイトとしても保持

returns:
  # Barra の日次リターン（DRTN / SRTN）を Trading_day の区間に集約する。% は小数に、
  # 銘柄 ID は BID → nri_code（barraid_jp）に変換する（JPE4 の既定 asset_id: nri_code）
  - source: barra
    model: JPE4
    match_on: Trading_day        # 期間の境界（前行の Trading_day の翌日〜当該行の Trading_day）
    convention: realized
    currency: local
    series: {total: total, specific: specific}

risk_models:
  # Barra のリスクモデル。エクスポージャー・共分散は Trading_day 以前で最新の Barra の営業日のデータ、
  # ファクターリターンはリターンと同じ Trading_day の区間に加算で集約する
  jpe4:
    source: barra
    model: JPE4
    match_on: Trading_day
    components: [exposures, factor_covariance, factor_returns]
    specific_return: specific    # このモデルのスペシフィックリターン（returns の系列名）

metrics:
  - name: ic
    params: {method: spearman}
  - name: quantile
    params: {n_quantiles: 5}
  - name: quantile
    id: quantile_q10_specific  # 同じ metric を複数回使う場合は id 必須
    params: {n_quantiles: 10, signals: [ai], returns: [specific], horizons: [1]}
  - name: category_ic
    params: {returns: [specific], horizons: [1]}
  - name: alpha_decay
  - name: autocorr
    params: {lags: [1, 3, 6, 12]}
  # シグナル間と、シグナル × Barra のスタイル（risk_indices）エクスポージャーの相関
  - name: factor_correlation
    params: {risk_model: jpe4, factor_group: style}

execution:
  n_jobs: 4

output:
  dir: ./output/barra           # サンプルの結果（./output）と分ける
  formats: [csv]               # csv / parquet / xlsx（複数指定可）

cache:
  dir: ./.cache
