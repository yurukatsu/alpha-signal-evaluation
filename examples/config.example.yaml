# サンプル設定。examples/make_sample_data.py で作ったデータを評価する。
# 相対パスはこのファイルの場所を基準に解決される。
version: 1

calendar:
  path: ./input/calendar.tsv
  index: Base_day              # 内部で全データに付与する日付キー

period:
  start: "20150331"            # calendar.index の値で絞る
  end: "20191231"

horizons: [1, 3, 6]            # 単位 = カレンダーの行数

data:
  signals:
    source: file
    path: ./input/signals/{Base_day}.parquet
    columns: {asset_id: code}
    values: [value_score, momentum_12m, quality]
  classification:
    source: file
    path: ./input/sector/{Rskmdl_month}.csv
    columns: {asset_id: code, category: gics_sector}

universe:
  source: file
  path: ./input/universe.csv   # プレースホルダなし = 1ファイル。date 列を match_on の列と突き合わせる
  match_on: Trading_day
  columns: {asset_id: code, date: dt}

returns:
  - source: file
    path: ./input/returns/{Base_day}.csv
    convention: realized       # 行 t のファイル = 行 t-1 → t の実現リターン
    columns: {asset_id: code}
    series:
      total:    {column: ret,  kind: total}
      specific: {column: sret, kind: residual}
  # DB から日次で取得して期間に集約する場合（接続先は io/db/configs で定義）:
  # - source: db
  #   connection: risk_models
  #   query: ./sql/barra_returns_daily.sql   # WHERE dt > :start AND dt <= :end
  #   match_on: Trading_day
  #   columns: {date: dt, asset_id: code}
  #   series:
  #     total:    {column: ret,  kind: total}
  #     specific: {column: sret, kind: residual}

risk_models:
  barra:
    exposures:
      source: file
      path: ./input/barra/{Rskmdl_month}.dat
      read_options: {sep: "\t"}
      columns: {asset_id: code}
    specific_return: specific
    factor_groups:
      style: [SIZE, MOMENTUM]

metrics:
  - name: ic
    params: {method: spearman}
  - name: quantile
    params: {n_quantiles: 5}
  - name: quantile
    id: quantile_q10_specific  # 同じ metric を複数回使う場合は id 必須
    params: {n_quantiles: 10, returns: [specific], horizons: [1]}
  - name: category
    params: {returns: [specific], horizons: [1]}
  - name: alpha_decay
  - name: autocorr
    params: {lags: [1, 3, 6, 12]}
  - name: factor_correlation

execution:
  n_jobs: 4

output:
  dir: ./output
  formats: [parquet, xlsx]

cache:
  dir: ./.cache
