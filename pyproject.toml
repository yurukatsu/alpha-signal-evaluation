[project]
name = "alpha-signal-evaluation"
version = "0.1.0"
description = "Alpha Signal Evaluation System (ASES) is a specialized Python library used for the performance analysis and evaluation of predictive stock (alpha) factors"
readme = "README.md"
authors = [
    { name = "r-yamamoto" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "typer>=0.27.2",
]

[project.scripts]
alpha-eval = "alpha_signal_evaluation.cli:app"

[project.optional-dependencies]
mssql = [
    "pyodbc>=5.3.0",
]
postgres = [
    "psycopg2-binary>=2.9.13",
]
mysql = [
    "pymysql>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
app = [
    "streamlit>=1.64.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
example = [
    "notebook>=7.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 実 DB に接続するテストは `uv run pytest -m integration` で明示的に実行する
addopts = "-m 'not integration'"
markers = [
    "integration: tests that connect to external databases",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040"]  # 型エイリアスは TypeAlias で書く（pydantic・既存コードと揃える）
